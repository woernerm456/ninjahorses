<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja vs. Big Horses</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #14141f;
    font-family: system-ui, sans-serif;
    color: #eee;
    display: flex; flex-direction: column;
    align-items: center; min-height: 100vh;
  }
  h1 { margin: 14px 0 6px; font-size: 22px; letter-spacing: 1px; }
  #hint { margin: 0 0 10px; font-size: 13px; color: #9aa; }
  canvas {
    background: #70b0e0;
    border: 3px solid #2c2c3a;
    border-radius: 6px;
    max-width: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<h1>🥷 Ninja vs. Big Horses 🐴</h1>
<p id="hint">←/→ or A/D to move · Space/↑/W to jump · stomp the horses, avoid pits,
reach the flag before the 5:00 timer runs out</p>
<canvas id="game" width="900" height="520"></canvas>
<script src="game.js"></script>
</body>
</html>
